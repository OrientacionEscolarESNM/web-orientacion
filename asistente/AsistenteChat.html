<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; margin: 0; display: flex; flex-direction: column; height: 100vh; }
    
    .chat-header { background: #1e3a5f; color: white; padding: 15px; text-align: center; font-size: 14px; font-weight: bold; display: flex; align-items: center; justify-content: space-between; }
    .btn-home { background: rgba(255,255,255,0.1); border: none; color: white; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 11px; }

    #chat-container { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
    
    .msg { max-width: 85%; padding: 10px 14px; border-radius: 15px; font-size: 13px; line-height: 1.4; position: relative; }
    .msg-bot { align-self: flex-start; background: white; color: #333; border-bottom-left-radius: 2px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
    .msg-user { align-self: flex-end; background: #1e3a5f; color: white; border-bottom-right-radius: 2px; }
    
    .input-area { background: white; padding: 15px; border-top: 1px solid #ddd; display: flex; gap: 8px; flex-direction: column; }
    .input-row { display: flex; gap: 8px; }
    input[type="text"] { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 20px; outline: none; font-size: 13px; }
    .btn-send { background: #1e3a5f; color: white; border: none; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    
    .upload-box { background: #e8f0fe; border: 2px dashed #1e3a5f; border-radius: 10px; padding: 10px; text-align: center; display: none; }
    .upload-box p { margin: 0 0 8px 0; font-size: 12px; color: #1e3a5f; font-weight: bold; }
    input[type="file"] { font-size: 11px; width: 100%; }
    
    .loading { font-style: italic; color: #777; font-size: 11px; display: none; }
  </style>
</head>
<body>
  <div class="chat-header">
    <span>🤖 Asistente Chatbot</span>
    <button class="btn-home" onclick="google.script.run.abrirAsistenteHome()">🏠 Inicio</button>
  </div>

  <div id="chat-container">
    <div class="msg msg-bot">¡Hola! Soy el Administrador Integral. ¿Qué deseas gestionar hoy?<br><br>Escribe: <b>Comunicado, Actividad, Campaña, Multimedia, Juego, Recurso, Tema o Bloque</b>.</div>
  </div>

  <div class="input-area">
    <div id="upload-container" class="upload-box">
      <p id="upload-label">Adjuntar archivo</p>
      <input type="file" id="file-input" onchange="uploadFile()">
    </div>
    <div class="input-row">
      <input type="text" id="user-input" placeholder="Escribe aquí..." onkeypress="if(event.key==='Enter') send()">
      <button class="btn-send" onclick="send()">➤</button>
    </div>
    <div id="loading" class="loading">Pensando...</div>
  </div>

  <script>
    var chatContext = { state: 'IDLE', data: {} };

    function appendMsg(type, txt) {
      var container = document.getElementById('chat-container');
      var div = document.createElement('div');
      div.className = 'msg msg-' + type;
      div.innerHTML = txt.replace(/\n/g, '<br>');
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
    }

    function send() {
      var input = document.getElementById('user-input');
      var msg = input.value.trim();
      if (!msg) return;

      appendMsg('user', msg);
      input.value = '';
      input.type = 'text'; // Reset al enviar
      
      document.getElementById('loading').style.display = 'block';

      google.script.run
        .withSuccessHandler(function(res) {
          document.getElementById('loading').style.display = 'none';
          chatContext.state = res.state;
          chatContext.data = res.data;
          if (res.entidad !== undefined) chatContext.entidad = res.entidad;
          if (res.step !== undefined) chatContext.step = res.step;
          
          if (res.inputType === 'date') {
            var inputEl = document.getElementById('user-input');
            inputEl.type = 'date';
            inputEl.value = new Date().toISOString().split('T')[0];
          }
          appendMsg('bot', res.respuesta);
          
          if (res.inputType === 'select' && res.options) {
            var container = document.getElementById('chat-container');
            var optContainer = document.createElement('div');
            optContainer.style.display = 'flex';
            optContainer.style.flexWrap = 'wrap';
            optContainer.style.gap = '5px';
            optContainer.style.marginTop = '5px';
            optContainer.style.marginBottom = '10px';
            
            res.options.forEach(function(opt) {
              var btn = document.createElement('button');
              btn.innerText = opt.nombre + " (" + opt.id + ")";
              btn.style.padding = '6px 12px';
              btn.style.background = 'white';
              btn.style.color = '#1e3a5f';
              btn.style.border = '1px solid #1e3a5f';
              btn.style.borderRadius = '15px';
              btn.style.cursor = 'pointer';
              btn.style.fontSize = '12px';
              btn.onclick = function() {
                document.getElementById('user-input').value = opt.id;
                send();
              };
              optContainer.appendChild(btn);
            });
            container.appendChild(optContainer);
            container.scrollTop = container.scrollHeight;
          }
          
          // Manejar zona de carga
          var uploadBox = document.getElementById('upload-container');
          if (res.showUpload) {
            uploadBox.style.display = 'block';
            document.getElementById('upload-label').innerText = "Subir " + (res.showUpload === 'image' ? 'Imagen' : 'Documento');
            chatContext.uploadType = res.showUpload;
            chatContext.uploadKey = res.uploadKey;
          } else {
            uploadBox.style.display = 'none';
            chatContext.uploadType = null;
            chatContext.uploadKey = null;
          }
        })
        .withFailureHandler(function(err) {
          document.getElementById('loading').style.display = 'none';
          appendMsg('bot', '❌ Error de conexión: ' + err.message);
        })
        .procesarMensajeChat(msg, chatContext);
    }

        function uploadFile() {
      var fileInput = document.getElementById('file-input');
      if (fileInput.files.length === 0) return;

      var file = fileInput.files[0];
      var isPdf = file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf');
      var uploadType = chatContext.uploadType;
      var uploadKey = chatContext.uploadKey;
      
      if (uploadType === 'image' && isPdf) {
        appendMsg('bot', '⚠️ Esperaba un archivo multimedia (imagen o video), pero subiste un PDF. Sube una imagen/video o escribe "No".');
        fileInput.value = '';
        return;
      }

      var reader = new FileReader();
      document.getElementById('loading').innerText = "Subiendo archivo...";
      document.getElementById('loading').style.display = 'block';

      reader.onload = function(e) {
        var bytes = e.target.result.split(',')[1];
        
        if (uploadType === 'image') {
          // Usar la subida directa desde el navegador (como en FormVideo.html)
          subirACloudinaryChat(file, function(url) {
            document.getElementById('loading').style.display = 'none';
            chatContext.data[uploadKey] = url;
            fileInput.value = '';
            sendDirect("✅ Archivo multimedia subido con éxito.");
          });
        } else if (uploadType === 'pdf') {
          google.script.run
            .withSuccessHandler(function(res) {
              document.getElementById('loading').style.display = 'none';
              chatContext.data[uploadKey] = res.url;
              fileInput.value = '';
              sendDirect("✅ Archivo subido con éxito.");
            })
            .withFailureHandler(function(err) {
              document.getElementById('loading').style.display = 'none';
              appendMsg('bot', '❌ Error al subir archivo: ' + err.message);
            })
            .uploadToDrive(bytes, file.name, file.type);
        }
      };
      reader.readAsDataURL(file);
    }

        function subirACloudinaryChat(archivo, callback) {
      var CLOUD_NAME = 'denrgxzvw';
      var UPLOAD_PRESET = 'consejo-padres';
      var formData = new FormData();
      formData.append('file', archivo);
      formData.append('upload_preset', UPLOAD_PRESET);
      formData.append('folder', 'consejo-padres/chat');

      var tipo = (archivo.type || '').toLowerCase();
      var endpoint = tipo.startsWith('video/') ? 'video/upload' : 'image/upload';

      var xhr = new XMLHttpRequest();
      xhr.open('POST', 'https://api.cloudinary.com/v1_1/' + CLOUD_NAME + '/' + endpoint);

      xhr.upload.onprogress = function(e) {
        if (e.lengthComputable) {
          var pct = Math.round((e.loaded / e.total) * 100);
          document.getElementById('loading').innerText = '☁️ Subiendo archivo... ' + pct + '%';
        }
      };

      xhr.onload = function() {
        if (xhr.status === 200) {
          var res = JSON.parse(xhr.responseText);
          callback(res.secure_url);
        } else {
          document.getElementById('loading').style.display = 'none';
          try {
            var err = JSON.parse(xhr.responseText);
            appendMsg('bot', '❌ Error Cloudinary: ' + (err.error ? err.error.message : 'Desconocido'));
          } catch(e) {
            appendMsg('bot', '❌ Error al subir a Cloudinary.');
          }
        }
      };
      
      xhr.onerror = function() {
        document.getElementById('loading').style.display = 'none';
        appendMsg('bot', '❌ Error de red al conectarse a Cloudinary.');
      };

      xhr.send(formData);
    }
    
    function sendDirect(msg) {
      appendMsg('user', '📎 [Archivo Adjunto]');
      document.getElementById('loading').style.display = 'block';
      google.script.run
        .withSuccessHandler(function(res) {
          document.getElementById('loading').style.display = 'none';
          chatContext.state = res.state;
          chatContext.data = res.data;
          if (res.entidad !== undefined) chatContext.entidad = res.entidad;
          if (res.step !== undefined) chatContext.step = res.step;
          
          if (res.inputType === 'date') {
            var inputEl = document.getElementById('user-input');
            inputEl.type = 'date';
            inputEl.value = new Date().toISOString().split('T')[0];
          }
          appendMsg('bot', res.respuesta);
          
          if (res.inputType === 'select' && res.options) {
            var container = document.getElementById('chat-container');
            var optContainer = document.createElement('div');
            optContainer.style.display = 'flex';
            optContainer.style.flexWrap = 'wrap';
            optContainer.style.gap = '5px';
            optContainer.style.marginTop = '5px';
            optContainer.style.marginBottom = '10px';
            
            res.options.forEach(function(opt) {
              var btn = document.createElement('button');
              btn.innerText = opt.nombre + " (" + opt.id + ")";
              btn.style.padding = '6px 12px';
              btn.style.background = 'white';
              btn.style.color = '#1e3a5f';
              btn.style.border = '1px solid #1e3a5f';
              btn.style.borderRadius = '15px';
              btn.style.cursor = 'pointer';
              btn.style.fontSize = '12px';
              btn.onclick = function() {
                document.getElementById('user-input').value = opt.id;
                send();
              };
              optContainer.appendChild(btn);
            });
            container.appendChild(optContainer);
            container.scrollTop = container.scrollHeight;
          }

          document.getElementById('upload-container').style.display = 'none';
        })
        .withFailureHandler(function(err) {
          document.getElementById('loading').style.display = 'none';
          appendMsg('bot', '❌ Error al procesar archivo: ' + err.message);
        })
        .procesarMensajeChat(msg, chatContext);
    }
  </script>
</body>
</html>
