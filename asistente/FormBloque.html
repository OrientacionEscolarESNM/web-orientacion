<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <title>Agregar Bloque</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 16px; background: #f5f5f5; }
    h2 { color: #1e3a5f; font-size: 16px; margin-bottom: 16px; }
    label { display: block; font-size: 12px; font-weight: bold; color: #444; margin-bottom: 4px; margin-top: 10px; }
    input, select, textarea { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; background: white; box-sizing: border-box; }
    textarea { height: 90px; resize: vertical; }
    .fila2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .btn { width: 100%; padding: 10px; background: #1e3a5f; color: white; border: none; border-radius: 6px; font-size: 14px; font-weight: bold; margin-top: 14px; cursor: pointer; }
    .btn:hover { background: #2d5a8f; }
    .msg { padding: 8px; border-radius: 6px; font-size: 12px; margin-top: 8px; display: none; }
    .ok { background: #d4edda; color: #155724; }
    .err { background: #f8d7da; color: #721c24; }
    .nota { font-size: 11px; color: #888; margin-top: 2px; }
  </style>
</head>
<body>
  <div style="margin-bottom: 15px;">
    <button onclick="google.script.run.abrirAsistenteHome()" style="background: #eee; border: 1px solid #ccc; border-radius: 4px; color: #1e3a5f; cursor: pointer; font-size: 11px; padding: 4px 8px; font-weight: bold;">
      🏠 Volver al Inicio
    </button>
  </div>

  <h2>🧱 Agregar Bloque de Contenido</h2>

  <label>ID del Tema * <span class="nota">(tm-XXXXXXXX)</span></label>
  <input type="text" id="tema_id" placeholder="tm-001">

  <div class="fila2">
    <div>
      <label>Tipo de bloque</label>
      <select id="tipo_bloque">
        <option value="texto">Texto</option>
        <option value="video">Video</option>
        <option value="imagen">Imagen</option>
        <option value="recurso">Recurso</option>
        <option value="actividad">Actividad</option>
      </select>
    </div>
    <div>
      <label>Visible</label>
      <select id="visible">
        <option value="si">Sí</option>
        <option value="no">No</option>
      </select>
    </div>
  </div>

  <label>Título del bloque</label>
  <input type="text" id="titulo_bloque" placeholder="Título opcional del bloque">

  <label>Contenido *</label>
  <textarea id="contenido" placeholder="Texto, URL, ID del recurso..."></textarea>

  <label>Orden <span class="nota">(número)</span></label>
  <input type="number" id="orden" placeholder="1" min="1">

  <div id="msg" class="msg"></div>
  <button class="btn" onclick="guardar()">&#x1F4BE; Guardar Bloque</button>

  <script>
    function guardar() {
      var tema_id = document.getElementById('tema_id').value.trim();
      var contenido = document.getElementById('contenido').value.trim();
      if (!tema_id) { mostrar('err', '\u26A0\uFE0F El ID del tema es obligatorio.'); return; }
      if (!contenido) { mostrar('err', '\u26A0\uFE0F El contenido es obligatorio.'); return; }
      var data = {
        tema_id: tema_id,
        tipo_bloque: document.getElementById('tipo_bloque').value,
        titulo_bloque: document.getElementById('titulo_bloque').value,
        contenido: contenido,
        orden: document.getElementById('orden').value || '1',
        visible: document.getElementById('visible').value
      };
      mostrar('ok', '\uD83D\uDCBE Guardando...');
      google.script.run
        .withSuccessHandler(function(r) { mostrar('ok', '\u2705 ' + r.msg); limpiar(); })
        .withFailureHandler(function(e) { mostrar('err', '\u274C Error: ' + e.message); })
        .guardarBloque(data);
    }
    function limpiar() {
      ['tema_id','titulo_bloque','contenido','orden'].forEach(function(id){ document.getElementById(id).value=''; });
      document.getElementById('tipo_bloque').value = 'texto';
      document.getElementById('visible').value = 'si';
    }
    function mostrar(tipo, txt) {
      var el = document.getElementById('msg');
      el.className = 'msg ' + tipo; el.innerText = txt; el.style.display = 'block';
    }
  </script>
</body>
</html>
