<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <title>Agregar Juego</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 16px; background: #f5f5f5; }
    h2 { color: #1e3a5f; font-size: 16px; margin-bottom: 16px; }
    label { display: block; font-size: 12px; font-weight: bold; color: #444; margin-bottom: 4px; margin-top: 10px; }
    input, select, textarea { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; background: white; box-sizing: border-box; }
    textarea { height: 70px; resize: vertical; }
    .fila2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .btn { width: 100%; padding: 10px; background: #1e3a5f; color: white; border: none; border-radius: 6px; font-size: 14px; font-weight: bold; margin-top: 14px; cursor: pointer; }
    .btn:hover { background: #2d5a8f; }
    .msg { padding: 8px; border-radius: 6px; font-size: 12px; margin-top: 8px; display: none; }
    .ok { background: #d4edda; color: #155724; }
    .err { background: #f8d7da; color: #721c24; }
  </style>
</head>
<body>
  <div style="margin-bottom: 15px;">
    <button onclick="google.script.run.abrirAsistenteHome()" style="background: #eee; border: 1px solid #ccc; border-radius: 4px; color: #1e3a5f; cursor: pointer; font-size: 11px; padding: 4px 8px; font-weight: bold;">
      🏠 Volver al Inicio
    </button>
  </div>

  <h2>🎮 Agregar Juego</h2>

  <label>Título *</label>
  <input type="text" id="titulo" placeholder="Nombre del juego">

  <label>Descripción</label>
  <textarea id="descripcion" placeholder="Describe el juego..."></textarea>

  <label>URL del juego *</label>
  <input type="url" id="juego_url" placeholder="https://...">

  <div class="fila2">
    <div>
      <label>Camaña (cam-XXX)</label>
      <input type="text" id="campana" placeholder="cam-001">
    </div>
    <div>
      <label>Visible</label>
      <select id="visible">
        <option value="si">Sí</option>
        <option value="no">No</option>
      </select>
    </div>
  </div>

  <div id="msg" class="msg"></div>
  <button class="btn" onclick="guardar()">&#x1F4BE; Guardar Juego</button>

  <script>
    function guardar() {
      var titulo = document.getElementById('titulo').value.trim();
      var juego_url = document.getElementById('juego_url').value.trim();
      if (!titulo) { mostrar('err', '\u26A0\uFE0F El t\u00edtulo es obligatorio.'); return; }
      if (!juego_url) { mostrar('err', '\u26A0\uFE0F La URL del juego es obligatoria.'); return; }
      var data = {
        titulo: titulo,
        descripcion: document.getElementById('descripcion').value,
        juego_url: juego_url,
        campana: document.getElementById('campana').value,
        visible: document.getElementById('visible').value
      };
      mostrar('ok', '\uD83D\uDCBE Guardando...');
      google.script.run
        .withSuccessHandler(function(r) { mostrar('ok', '\u2705 ' + r.msg); limpiar(); })
        .withFailureHandler(function(e) { mostrar('err', '\u274C Error: ' + e.message); })
        .guardarJuego(data);
    }
    function limpiar() {
      ['titulo','descripcion','juego_url','campana'].forEach(function(id){ document.getElementById(id).value=''; });
      document.getElementById('visible').value = 'si';
    }
    function mostrar(tipo, txt) {
      var el = document.getElementById('msg');
      el.className = 'msg ' + tipo; el.innerText = txt; el.style.display = 'block';
    }
  </script>
</body>
</html>
