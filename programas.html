<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuestros Programas | Orientación Escolar ENSM</title>
    <meta name="description" content="Programas institucionales de Orientación Escolar de la ENSM.">

    <!-- Design System & Fonts -->
    <link rel="stylesheet" href="assets/css/orientacion.css">
    
    <!-- Iconify -->
    <script src="https://code.iconify.design/iconify-icon/1.0.8/iconify-icon.min.js"></script>

    <style>
        .page-header {
            padding: 8rem 0 4rem;
            background: var(--clr-bg-alt);
            text-align: center;
        }

        .programs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 2.5rem;
            padding: 4rem 0;
        }

        .program-card {
            background: white;
            border-radius: var(--radius-lg);
            overflow: hidden;
            border: 1px solid var(--clr-border);
            transition: 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            display: flex;
            flex-direction: column;
            text-decoration: none;
            color: inherit;
        }

        .program-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.08);
            border-color: var(--clr-primary-light);
        }

        .program-img {
            width: 100%;
            height: 240px;
            object-fit: cover;
            background: var(--clr-bg-alt);
        }

        .program-content {
            padding: 2rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .program-title {
            font-family: var(--font-display);
            font-size: 1.6rem;
            color: var(--clr-text);
            margin-bottom: 0.8rem;
            line-height: 1.2;
        }

        .program-subtitle {
            font-size: 1rem;
            color: var(--clr-primary);
            font-weight: 700;
            margin-bottom: 1rem;
            opacity: 0.8;
        }

        .program-excerpt {
            font-size: 0.95rem;
            color: var(--clr-text-muted);
            line-height: 1.6;
            margin-bottom: 1.5rem;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .program-footer {
            margin-top: auto;
            padding-top: 1.5rem;
            border-top: 1px solid var(--clr-border);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--clr-primary);
            font-weight: 700;
            font-size: 0.9rem;
        }
    </style>
</head>

<body>

    <!-- Header Navigation -->
    <header class="site-header">
        <div class="container nav-container">
            <a href="index.html" class="logo">
                <div class="logo-icon">
                    <img src="assets/img/escudo-norma.jpeg" alt="Escudo ENSM">
                </div>
                <div class="logo-text">
                    <h1 id="site-title">Orientación Escolar</h1>
                </div>
            </a>

            <nav class="nav-links">
                <a href="index.html#area">El Área</a>
                <a href="index.html#agenda">Agenda</a>
                <a href="programas.html" class="active">Programas</a>
                <a href="index.html#recursos">Recursos</a>
                <a href="emisora.html">Emisora</a>
                <a href="index.html#contacto">Contacto</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="page-header">
            <div class="container">
                <h2 class="font-display" style="font-size: clamp(2.5rem, 5vw, 4rem); margin: 0;">Nuestros <em>Programas</em></h2>
                <p style="max-width: 600px; margin: 1rem auto 0; color: var(--clr-text-muted);">Pilares fundamentales para el acompañamiento y bienestar de nuestra comunidad educativa.</p>
            </div>
        </section>

        <section class="container">
            <div id="programs-container" class="programs-grid">
                <!-- Se inyectarán dinámicamente -->
                <p style="text-align: center; grid-column: 1/-1;">Cargando programas...</p>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container copyright" style="text-align: center;">
            &copy; 2026 Escuela Normal Superior de Monterrey.
        </div>
    </footer>

    <!-- Logic Layer -->
    <script src="assets/js/data.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const container = document.getElementById('programs-container');
            const programas = await getSheetData('programas');

            if (!programas || programas.length === 0) {
                container.innerHTML = '<p>No se encontraron programas registrados.</p>';
                return;
            }

            container.innerHTML = '';
            programas.forEach(p => {
                const card = document.createElement('a');
                card.href = `programa.html?id=${p.id}`;
                card.className = 'program-card';
                card.innerHTML = `
                    <img src="${p.imagen_portada || 'assets/img/hero-bg.jpg'}" alt="${p.nombre}" class="program-img">
                    <div class="program-content">
                        <div class="program-subtitle">${p.subtitulo || ''}</div>
                        <h3 class="program-title">${p.nombre}</h3>
                        <p class="program-excerpt">${p.descripcion || ''}</p>
                        <div class="program-footer">
                            Explorar actividades y recursos
                            <iconify-icon icon="mdi:arrow-right" width="18"></iconify-icon>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        });
    </script>
</body>

</html>
